[project]
name = "parallax"
version = "0.1.0"
description = "parallax autonomous system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.14.3",
    "boto3>=1.43.101",
    "lightgbm>=4.7.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pydantic>=2.7.0",
    "rapidfuzz>=3.14.5",
    "scikit-learn>=1.7.2",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
